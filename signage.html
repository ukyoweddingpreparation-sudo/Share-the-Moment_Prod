<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ウェディングフォトサイネージ</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .slide-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    img.slide-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      position: absolute;
      transition: opacity 1s ease-in-out;
      opacity: 0;
    }
    img.slide-image.active {
      opacity: 1;
    }
    .meta-info {
      position: absolute;
      bottom: 30px;
      left: 30px;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 15px 25px;
      border-radius: 8px;
      font-size: 1.5rem;
      z-index: 10;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <div class="slide-container" id="slide-container">
    <div class="meta-info" id="meta-info">写真を読み込み中...</div>
  </div>

  <script>
    // 🌟 ご自身のGASのウェブアプリURLに書き換えてください
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx7KfZpUfWDkrEocp8ikhRQHRt-I7WE6MCT5yNx9V5vNbqDfrI2kJTJrGyQLWXVolqj/exec";
    
    let imageList = [];
    let currentIndex = 0;
    let knownImageIds = new Set();

    // 1. 初回データ取得とスライド開始
    async function fetchImagesInitial() {
      try {
        const res = await fetch(GAS_WEB_APP_URL);
        const data = await res.json();
        if (data.status === 'success' && data.images) {
          imageList = data.images;
          imageList.forEach(img => knownImageIds.add(img.id));
          
          if (imageList.length > 0) {
            startSlideshow();
          } else {
            document.getElementById('meta-info').innerText = "写真の投稿をお待ちください...";
          }
        }
      } catch (err) {
        console.error("初期読み込みエラー:", err);
      }
    }

    // 2. 裏側で新着画像を定期チェック（ページリロードなし）
    async function checkNewImagesBackground() {
      try {
        const res = await fetch(GAS_WEB_APP_URL);
        const data = await res.json();
        if (data.status === 'success' && data.images) {
          let hasNew = false;
          data.images.forEach(img => {
            if (!knownImageIds.has(img.id)) {
              knownImageIds.add(img.id);
              imageList.push(img); // 既存の再生リストに新着を追加！
              hasNew = true;
            }
          });
          if (hasNew) {
            console.log("✨ 新着画像を裏側でスライドに追加しました！");
          }
        }
      } catch (err) {
        console.error("バックグラウンド更新エラー:", err);
      }
    }

    // 3. スライドショーの制御
    function startSlideshow() {
      showNextSlide();

      // 5秒ごとに画像を切り替え
      setInterval(() => {
        if (imageList.length > 0) {
          showNextSlide();
        }
      }, 5000);

      // 15秒ごとに裏側で新着チェック（リロードなし）
      setInterval(checkNewImagesBackground, 15000);
    }

    // 4. 次の画像を表示する処理
    function showNextSlide() {
      const container = document.getElementById('slide-container');
      const metaInfo = document.getElementById('meta-info');

      if (imageList.length === 0) return;

      currentIndex = (currentIndex >= imageList.length) ? 0 : currentIndex;
      const currentImgData = imageList[currentIndex];

      const imgElem = document.createElement('img');
      imgElem.src = currentImgData.url;
      imgElem.className = 'slide-image';
      container.appendChild(imgElem);

      // 投稿者名とメッセージの表示
      let infoText = "";
      if (currentImgData.author) {
        infoText += `From: ${currentImgData.author}`;
      }
      if (currentImgData.message) {
        infoText += ` / ${currentImgData.message}`;
      }
      metaInfo.innerText = infoText;
      metaInfo.style.display = infoText ? 'block' : 'none';

      // フェードイン
      setTimeout(() => {
        imgElem.classList.add('active');
      }, 50);

      // 古い画像を自動削除（メモリ・DOM負荷対策）
      const images = container.querySelectorAll('img.slide-image');
      if (images.length > 3) {
        images[0].remove();
      }

      currentIndex++;
    }

    // 実行開始
    fetchImagesInitial();
  </script>
</body>
</html>
