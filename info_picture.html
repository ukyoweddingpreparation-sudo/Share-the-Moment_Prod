<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Information 管理者アップロード</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    * { box-sizing: border-box; } /* 🌟 枠からはみ出さないように全体に適用 */
    body { font-family: 'Noto Sans JP', sans-serif; background: #f1f5f9; color: #1e293b; max-width: 500px; margin: 40px auto; padding: 20px; }
    .card { background: #ffffff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    h2 { font-size: 1.25rem; margin-bottom: 20px; text-align: center; color: #b89753; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }
    
    /* 🌟 幅を100%に揃え、はみ出しを防ぐ設定を追加 */
    select, input[type="file"] { 
      width: 100%; 
      padding: 12px; 
      border: 1.5px solid #cbd5e1; 
      border-radius: 10px; 
      font-size: 0.9rem; 
      outline: none; 
      background: #f8fafc; 
      box-sizing: border-box; 
    }
    select:focus, input[type="file"]:focus { border-color: #b89753; background: #fff; }
    
    .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #e4cb91 0%, #b89753 100%); color: #fff; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; font-size: 1rem; margin-top: 10px; }
    .btn:active { transform: scale(0.98); }
    #status { margin-top: 16px; text-align: center; font-size: 0.9rem; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📸 Information写真 管理者アップロード</h2>
    
    <div class="form-group">
      <label>表示カテゴリ</label>
      <select id="category-select">
        <option value="memorial">記念集合写真</option>
        <option value="snapshot">会場スナップ</option>
      </select>
    </div>

    <div class="form-group">
      <label>アップロードする写真（複数選択可）</label>
      <input type="file" id="admin-file-input" accept="image/*" multiple>
    </div>

    <button class="btn" onclick="uploadAdminPhotos()">アップロードを実行する</button>
    <div id="status"></div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyWbPWILu2tPTj1p2hgGr89zwQlxNG7gbQ2CWJ8HTqsCl6VbX_1OzswmeAvymEqE0xV/exec";

    async function uploadAdminPhotos() {
      const category = document.getElementById('category-select').value;
      const fileInput = document.getElementById('admin-file-input');
      const statusDiv = document.getElementById('status');

      if (fileInput.files.length === 0) {
        alert('写真を選択してください。');
        return;
      }

      statusDiv.style.color = '#1e293b';
      statusDiv.innerText = `画像を処理中 (0/${fileInput.files.length}枚)...`;

      try {
        const files = Array.from(fileInput.files);
        const fileDataArray = await Promise.all(files.map(file => 
          new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
              const img = new Image();
              img.onload = () => {
                let w = img.width, h = img.height;
                if (w > h) { if (w > 2000) { h = Math.round(h * 2000 / w); w = 2000; } } 
                else { if (h > 2000) { w = Math.round(w * 2000 / h); h = 2000; } }
                const cvs = document.createElement('canvas'); cvs.width = w; cvs.height = h;
                cvs.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve({ base64Data: cvs.toDataURL('image/jpeg', 0.85), fileName: file.name });
              };
              img.onerror = reject; img.src = e.target.result;
            };
            reader.onerror = reject; reader.readAsDataURL(file);
          })
        ));

        statusDiv.innerText = `サーバーに送信中...`;

        const response = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "upload_info", category: category, chunk: fileDataArray })
        });

        const res = await response.json();
        if (res.success) {
          statusDiv.style.color = '#16a34a';
          statusDiv.innerText = `✨ アップロードが完了しました！メイン画面を確認してください。`;
          fileInput.value = '';
        } else {
          throw new Error(res.error || '不明なエラー');
        }

      } catch (err) {
        statusDiv.style.color = '#e11d48';
        statusDiv.innerText = `エラー: ${err.message}`;
      }
    }
  </script>
</body>
</html>
